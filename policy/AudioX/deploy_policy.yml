# ============================================================
# AudioX Policy Configuration for RoboTwin Evaluation
# ============================================================
# Workflow:
#   1. Fine-tune with train_robotx.py → saves checkpoint + action_stats.pt
#   2. Set model_config, ckpt_path, action_stats_path below
#   3. Run eval.sh <task> <task_config> <seed> <gpu_id>
# ============================================================

# --- Eval framework fields (keep null, overridden by eval.sh) ---
policy_name: AudioX
task_name: null
task_config: null
ckpt_setting: null
seed: null
instruction_type: unseen
head_camera_type: D435

# --- AudioX model loading ---
# Option 1: config + checkpoint (fine-tuned model)
model_config: configs/robotx_aloha_agilex.json
ckpt_path: null

# Option 2: HuggingFace pretrained (base model, not recommended for eval)
pretrained_name: null

# --- Post-processing weights (produced by training) ---
action_stats_path: null   # path to action_stats.pt for denormalization
action_head_path: null     # path to action_head.pt  (optional, identity if null)

# --- Action space ---
action_dim: 14             # ALOHA-Agilex: (6+1)*2 = 14
action_chunk_size: 50      # diffusion generates 50-step trajectory

# --- Vision ---
img_size: 224              # CLIP-ViT-B/32 input resolution

# --- Runtime ---
use_half: false            # fp16 inference (saves VRAM)
