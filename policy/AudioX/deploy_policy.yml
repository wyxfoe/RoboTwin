# ============================================================
# AudioX Policy Configuration for RoboTwin Evaluation
# ============================================================
# Two workflows:
#
# A) Direct mode (small DiT from scratch):
#   1. Train with train_robotx.py → saves checkpoint + action_stats.pt
#   2. Set model_config to configs/robotx_aloha_agilex.json
#
# B) Fine-tune mode (AudioX 1.2B pretrained):
#   1. Fine-tune with train_finetune.py → saves checkpoint + action_stats.pt
#   2. Set model_config to configs/robotx_finetune_1_2b.json
#
# Then:
#   3. Set ckpt_path, action_stats_path below
#   4. Run eval.sh <task> <task_config> <seed> <gpu_id>
# ============================================================

# --- Eval framework fields (keep null, overridden by eval.sh) ---
policy_name: AudioX
task_name: null
task_config: null
ckpt_setting: null
seed: null
instruction_type: unseen
head_camera_type: D435

# --- AudioX model loading ---
# Option 1: Direct mode (small DiT, io_channels=action_dim)
# model_config: configs/robotx_aloha_agilex.json

# Option 2: Fine-tune mode (AudioX 1.2B, io_channels=64 latent)
model_config: configs/robotx_finetune_1_2b.json

ckpt_path: checkpoints/beat_block_hammer_finetune/robotx-finetune-epochepoch=199.ckpt

# Option 3: HuggingFace pretrained (base model, not recommended for eval)
pretrained_name: null

# --- Post-processing weights (produced by training) ---
action_stats_path: checkpoints/beat_block_hammer_finetune/action_stats.pt   # path to action_stats.pt for denormalization
action_head_path: null     # path to action_head.pt  (optional, identity if null)

# --- Action space ---
action_dim: 14             # ALOHA-Agilex: (6+1)*2 = 14
action_chunk_size: 50      # diffusion generates 50-step trajectory

# --- Vision (must match training camera_names in config) ---
# Training uses: [front_camera, head_camera, left_camera, right_camera]
img_size: 224              # CLIP-ViT-B/32 input resolution

# --- Runtime ---
use_half: false            # fp16 inference (saves VRAM)
